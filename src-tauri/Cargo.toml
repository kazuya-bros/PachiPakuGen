[package]
name = "pachipakugen-app"
version = "0.4.0"
description = "Windows desktop workflow for creating layered facial-expression and motion assets for SpriTalk"
authors = ["kazuya_bros"]
edition = "2021"
license = "MIT"
repository = "https://github.com/kazuya-bros/PachiPakuGen"
homepage = "https://github.com/kazuya-bros/PachiPakuGen"
readme = "../README.md"

[lib]
name = "pachipakugen_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ort = { version = "2.0.0-rc.11", features = ["directml"] }
ndarray = "0.17"
image = "0.25"
psd = "0.3"
base64 = "0.22"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["blocking", "json", "multipart", "rustls-tls"] }
keyring-core = "1"
windows-native-keyring-store = "1.1"

# 開発ビルドでも依存クレートだけ最適化する。
# デバッグビルドの image/png エンコードは極端に遅く、
# プレビュー1回の再合成に数秒かかる主因だった（アプリ本体のコンパイル速度は維持）
[profile.dev.package."*"]
opt-level = 2
