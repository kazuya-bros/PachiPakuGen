[project]
name = "pachipakugen-sam3"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "opencv-python>=4.13.0.92",
    "psutil>=7.2.2",
    "sam3>=0.1.3",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "triton-windows>=3.7.0.post26",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
